name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Método de exportación del IPA"
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc
          - app-store
          - development
          - enterprise
  push:
    tags:
      - "v*"

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build signed IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $NAME ($UUID)"

      - name: Configure signing and ExportOptions
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'ad-hoc' }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Falta el secret APPLE_TEAM_ID"
            exit 1
          fi

          export BUNDLE_ID="${IOS_BUNDLE_ID:-com.example.crossfitTimer}"
          export APPLE_TEAM_ID
          export PROVISIONING_PROFILE_NAME
          export EXPORT_METHOD

          if [ "$EXPORT_METHOD" = "development" ]; then
            export CODE_SIGN_IDENTITY="Apple Development"
            export SIGNING_CERTIFICATE="Apple Development"
          else
            export CODE_SIGN_IDENTITY="iPhone Distribution"
            export SIGNING_CERTIFICATE="iPhone Distribution"
          fi

          # Firma manual + team + bundle id en el proyecto Xcode (solo en CI)
          python3 << 'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text(encoding="utf-8")
          bundle_id = os.environ["BUNDLE_ID"]
          team_id = os.environ["APPLE_TEAM_ID"]
          profile = os.environ["PROVISIONING_PROFILE_NAME"]
          identity = os.environ["CODE_SIGN_IDENTITY"]

          text = re.sub(
              r"PRODUCT_BUNDLE_IDENTIFIER = com\.example\.crossfitTimer;",
              f"PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};",
              text,
          )
          text = re.sub(
              r"PRODUCT_BUNDLE_IDENTIFIER = com\.example\.crossfitTimer\.RunnerTests;",
              f"PRODUCT_BUNDLE_IDENTIFIER = {bundle_id}.RunnerTests;",
              text,
          )

          runner_keys = (
              "DEVELOPMENT_TEAM",
              "CODE_SIGN_STYLE",
              "CODE_SIGN_IDENTITY",
              "PROVISIONING_PROFILE_SPECIFIER",
          )

          def inject_runner_signing(block: str) -> str:
              if "INFOPLIST_FILE = Runner/Info.plist;" not in block:
                  return block
              for key in runner_keys:
                  block = re.sub(rf"\t\t\t\t{key} = .*?;\n", "", block)
              insert = (
                  f'\t\t\t\tCODE_SIGN_IDENTITY = "{identity}";\n'
                  f"\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
                  f"\t\t\t\tDEVELOPMENT_TEAM = {team_id};\n"
                  f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile}";\n'
              )
              return block.replace(
                  "\t\t\t\tINFOPLIST_FILE = Runner/Info.plist;\n",
                  "\t\t\t\tINFOPLIST_FILE = Runner/Info.plist;\n" + insert,
              )

          text = re.sub(
              r"buildSettings = \{.*?\n\t\t\t\};",
              lambda m: inject_runner_signing(m.group(0)),
              text,
              flags=re.S,
          )
          path.write_text(text, encoding="utf-8")
          print(f"Configured signing for bundle id {bundle_id} ({identity})")
          PY

          python3 << 'PY'
          import os
          import textwrap
          from pathlib import Path

          method = os.environ["EXPORT_METHOD"]
          team = os.environ["APPLE_TEAM_ID"]
          cert = os.environ["SIGNING_CERTIFICATE"]
          bundle = os.environ["BUNDLE_ID"]
          profile = os.environ["PROVISIONING_PROFILE_NAME"]

          content = textwrap.dedent(
              f"""\
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
              <plist version="1.0">
              <dict>
              	<key>method</key>
              	<string>{method}</string>
              	<key>teamID</key>
              	<string>{team}</string>
              	<key>signingStyle</key>
              	<string>manual</string>
              	<key>signingCertificate</key>
              	<string>{cert}</string>
              	<key>provisioningProfiles</key>
              	<dict>
              		<key>{bundle}</key>
              		<string>{profile}</string>
              	</dict>
              	<key>compileBitcode</key>
              	<false/>
              	<key>stripSwiftSymbols</key>
              	<true/>
              	<key>uploadSymbols</key>
              	<true/>
              </dict>
              </plist>
              """
          )
          Path("ios/ExportOptions.plist").write_text(content, encoding="utf-8")
          PY

          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "EXPORT_METHOD=$EXPORT_METHOD" >> "$GITHUB_ENV"

      - name: Build IPA
        run: |
          set -euo pipefail
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          ls -la build/ios/ipa/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossfit-timer-${{ github.ref_name }}-${{ env.EXPORT_METHOD }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup keychain and profiles
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROVISIONING_PROFILE_UUID}.mobileprovision" || true
